
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Smart Library Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background: linear-gradient(
                135deg,
                #050816,
                #0f172a,
                #111827
            );
            color:white;
            min-height:100vh;
            font-family:Arial;
        }

        .navbar{
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(20px);
            padding:20px;
        }

        .title{
            font-size:40px;
            font-weight:bold;
        }

        .book-card{
            background:rgba(255,255,255,0.06);
            border-radius:25px;
            padding:20px;
            transition:0.4s;
            backdrop-filter:blur(20px);
            box-shadow:0 0 20px rgba(0,0,0,0.4);
            height:100%;
        }

        .book-card:hover{
            transform:translateY(-10px);
            box-shadow:0 0 30px rgba(147,51,234,0.5);
        }

        .book-image{
            width:100%;
            height:250px;
            object-fit:cover;
            border-radius:20px;
            margin-bottom:20px;
        }

        .price{
            color:#22c55e;
            font-size:24px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<nav class="navbar d-flex justify-content-between">

    <div class="title">

        📚 Smart Library

    </div>

    <a href="/" class="btn btn-outline-light">

        Dashboard

    </a>

</nav>

<div class="container mt-5">

    <div class="row g-4">

        {% for book in books %}

        <div class="col-md-4">

            <div class="book-card">

                <img src="{{ book.image.url }}"
                    class="book-image">

                <h2>{{ book.title }}</h2>

                <p class="text-secondary">

                    Author:
                    {{ book.author }}

                </p>

                <div class="price">

                    ₹ {{ book.price }}

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
